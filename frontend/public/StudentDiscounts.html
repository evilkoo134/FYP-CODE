<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Discounts</title>
    <style>
        :root {
            --primary-color: #007bff;
            --hover-color: #0056b3;
            --background-light: #f2f2f2;
            --border-color-light: #ccc;
            --text-color: #333;
            --error-color: #ff0000;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-light);
        }

        header {
            background-color: var(--background-light);
            padding: 10px 20px;
            text-align: center;
        }

        main {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            box-shadow: 0 0 10px var(--border-color-light);
        }

        .discount-form form {
            margin-top: 20px;
        }

        .discount-form input[type="email"], .discount-form button {
            padding: 10px;
            margin-top: 5px;
        }

        .discount-form button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
        }

        .discount-form button:hover,
        .discount-form button:focus {
            background-color: var(--hover-color);
            outline: none;
        }

        .discount-list ul {
            list-style-type: none;
            padding: 0;
        }

        .discount-list li {
            background-color: var(--background-light);
            margin-top: 10px;
            padding: 10px;
            border-left: 5px solid var(--primary-color);
        }

        nav {
            background-color: var(--primary-color);
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: var(--background-light);
            border-bottom: 1px solid var(--border-color-light);
        }

        .navbar a,
        .navbar input,
        .navbar button {
            margin: 0 5px;
        }

        .navbar a,
        .navbar button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            text-align: center;
        }

        .navbar a:hover,
        .navbar button:hover,
        .navbar a:focus,
        .navbar button:focus {
            background-color: var(--hover-color);
            outline: none;
        }

        input[type="text"],
        input[type="date"],
        button,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--border-color-light);
            border-radius: 4px;
            background-color: white;
            color: var(--text-color);
        }

        @media screen and (min-width: 768px) {
            .navbar input {
                flex: 1;
            }

            .navbar a,
            .navbar button {
                flex: 0 0 auto;
            }
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>Student Travel Discounts</h1>
        <nav class="navbar">
            <a href="Landing Page.html" id="home">Home</a>
            <a href="StudentDiscounts.html">Discover Discounts</a>
            <input type="text" placeholder="Search for a destination" aria-label="Search for a destination">
            <a href="Log in.html" id="login">Log in</a>
            <a href="Sign Up.html" id="signup">Sign Up</a>
        </nav>
    </header>

    <main>
        <section class="discount-form">
            <h2>Verify Student Status</h2>
            <form id="verify-student-form">
                <label for="student-email">Student Email:</label>
                <input type="email" id="student-email" name="student-email" placeholder="Enter your university email" aria-label="Student Email">
                <button type="submit">Verify</button>
            </form>
        </section>

        <section class="discount-list">
            <h2>Available Discounts</h2>
            <ul>
                <li>20% off all flights to Europe</li>
                <li>15% off select hotels in London</li>
                <li>10% off car rentals worldwide</li>
            </ul>
        </section>
    </main>
    <script>
        document.getElementById('verify-student-form').addEventListener('submit', function(event) {
            event.preventDefault();  // Prevent the default form submission
            const emailInput = document.getElementById('student-email');
            if (emailInput.value.endsWith('@university.edu')) {
                alert('Verification successful. You are eligible for student discounts.');
            } else {
                alert('Please enter a valid university email address.');
            }

            // Enhancement: Display user email if logged in
            const userEmail = localStorage.getItem('userEmail');
            if (userEmail) {
                document.getElementById('login').innerText = userEmail;
                document.getElementById('signup').style.display = 'none';
            }
        });

        document.addEventListener("DOMContentLoaded", function () {
            const userEmail = localStorage.getItem('userEmail');
            if (userEmail) {
                const loginElement = document.getElementById('login');
                loginElement.innerText = userEmail;
                loginElement.href = "#";
                loginElement.classList.add('dropdown');
                const dropdownContent = document.createElement('div');
                dropdownContent.classList.add('dropdown-content');
                const logoutLink = document.createElement('a');
                logoutLink.innerText = 'Log Out';
                logoutLink.href = "#";
                logoutLink.onclick = function () {
                    localStorage.removeItem('userEmail');
                    window.location.assign("Log in.html");
                };
                const landingPageLink = document.createElement('a');
                landingPageLink.innerText = 'Landing Page';
                landingPageLink.href = "Landing Page.html";
                dropdownContent.appendChild(landingPageLink);
                dropdownContent.appendChild(logoutLink);
                loginElement.appendChild(dropdownContent);
                document.getElementById('signup').style.display = 'none';
            }
        });
    </script>
</body>
</html>
