<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Discounts</title>
    <script src="script.js" defer>
        document.getElementById('verify-student-form').addEventListener('submit', function(event) {
        event.preventDefault();  // Prevent the default form submission
        const emailInput = document.getElementById('student-email');
        if (emailInput.value.endsWith('@university.edu')) {
            alert('Verification successful. You are eligible for student discounts.');
        } else {
            alert('Please enter a valid university email address.');
        }
    });

    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #f4f4f4;
            padding: 10px 20px;
            text-align: center;
        }

        header nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #333;
        }

        main {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            box-shadow: 0 0 10px #ccc;
        }

        .discount-form form {
            margin-top: 20px;
        }

        .discount-form input[type="email"], .discount-form button {
            padding: 10px;
            margin-top: 5px;
        }

        .discount-form button {
            background-color: #0056b3;
            color: white;
            border: none;
            cursor: pointer;
        }

        .discount-form button:hover {
            background-color: #003d7a;
        }

        .discount-list ul {
            list-style-type: none;
            padding: 0;
        }

        .discount-list li {
            background-color: #f2f2f2;
            margin-top: 10px;
            padding: 10px;
            border-left: 5px solid #007bff;
        }

        footer {
            text-align: center;
            padding: 10px 0;
            background-color: #f4f4f4;
        }

    </style>
</head>
<body>
    <header>
        <h1>Student Travel Discounts</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/guides">Guides</a>
            <a href="/discounts">Discounts</a>
        </nav>
    </header>

    <main>
        <section class="discount-form">
            <h2>Verify Student Status</h2>
            <form id="verify-student-form">
                <label for="student-email">Student Email:</label>
                <input type="email" id="student-email" name="student-email" placeholder="Enter your university email">
                <button type="submit">Verify</button>
            </form>
        </section>

        <section class="discount-list">
            <h2>Available Discounts</h2>
            <ul>
                <li>20% off all flights to Europe</li>
                <li>15% off select hotels in London</li>
                <li>10% off car rentals worldwide</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>© 2024 TravelSite. All rights reserved.</p>
    </footer>
</body>
</html>
