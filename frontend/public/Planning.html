<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan a Trip</title>
    <style>
        :root {
            --primary-color: #007bff;
            --hover-color: #0056b3;
            --background-light: #f2f2f2;
            --border-color-light: #ccc;
            --text-color: #333;
            --error-color: #ff0000;
            --focus-color: #ffbf47;
            --animation-duration: 0.3s;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-light);
        }

        body, input, button, select, textarea {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: var(--background-light);
            border-bottom: 1px solid var(--border-color-light);
        }

        .navbar a, .navbar input, .navbar button {
            margin: 0 5px;
        }

        .navbar a, .navbar button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            text-align: center;
            transition: background-color var(--animation-duration);
        }

        .navbar a:hover, .navbar button:hover, .navbar a:focus, .navbar button:focus {
            background-color: var(--hover-color);
            outline: none;
        }

        input[type="text"], input[type="date"], button, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--border-color-light);
            border-radius: 4px;
            background-color: white;
            color: var(--text-color);
            transition: border-color var(--animation-duration);
        }

        input[type="text"]:focus,input[type="date"]:focus,button:focus,select:focus,textarea:focus {
            border-color: var(--focus-color);
            outline: none;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background-color var(--animation-duration);
        }

        button:hover, button:focus {
            background-color: var(--hover-color);
            outline: none;
        }

        :focus {
            outline: 3px dashed var(--hover-color);
            outline-offset: 4px;
        }

        .main-container {
            padding: 20px;
        }

        form {
            max-width: 600px;
            margin: auto;
            background-color: var(--background-light);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: box-shadow var(--animation-duration);
        }

        form:hover {
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        fieldset {
            border: none;
            padding: 0;
        }

        legend {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .feedback {
            color: var(--error-color);
            font-size: 0.9em;
        }

        .privacy-settings {
            margin-top: 10px;
        }
        
        @media screen and (min-width: 768px) {
            .navbar input {
                flex: 1;
            }

            .navbar a, .navbar button {
                flex: 0 0 auto;
            }
        }

        nav {
            background-color: var(--primary-color);
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
        
        h1 {
            text-align: center;
        }

        .main-container {
            width: auto;
            height: fit-content;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            border: 1px dotted black;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: var(--text-color);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity var(--animation-duration);
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <header>
    <nav class="navbar">
        <a href="Landing Page.html" id="home">Home</a>
        <a href="StudentDiscounts.html">Discover Discounts</a>
        <select id="destinationSelect" aria-label="Select a destination">
            <option value="" disabled selected>Select a destination</option>
            <option value="paris">Paris</option>
            <option value="newyork">New York</option>
            <option value="tokyo">Tokyo</option>
            <option value="sydney">Sydney</option>
            <option value="london">London</option>
        </select>        
        <a href="Log in.html" id="login">Log in</a>
        <a href="Sign Up.html" id="signup">Sign Up</a>
    </nav>
    </header>

    <main class="main-container" role="main">
        <h1>Plan a Trip!</h1>
        <form id="tripForm">
            <label for="destination">Select destination <span class="tooltip">?
                <span class="tooltiptext">Choose your travel destination</span>
            </span></label>
            <select id="destination" name="destination" required>
                <option value="">Choose a destination</option>
                <option value="Paris">Paris</option>
                <option value="New York">New York</option>
                <option value="Tokyo">Tokyo</option>
                <option value="Sydney">Sydney</option>
                <option value="London">London</option>
            </select>
            <p id="destinationFeedback" class="feedback"></p>

            <fieldset>
                <label for="start-date">Start Date <span class="tooltip">?
                    <span class="tooltiptext">Select the start date of your trip</span>
                </span></label>
                <input type="date" id="start-date" name="start-date" required>

                <label for="end-date">End Date <span class="tooltip">?
                    <span class="tooltiptext">Select the end date of your trip</span>
                </span></label>
                <input type="date" id="end-date" name="end-date" required>
            </fieldset>

            <label for="invitees">Invite Friends (comma-separated emails, optional) <span class="tooltip">?
                <span class="tooltiptext">Enter the emails of friends you want to invite</span>
            </span></label>
            <input type="text" id="invitees" name="invitees" placeholder="Enter emails">

            <button type="submit" id="start-planning">Start Planning</button>
        </form>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("start-date").setAttribute('min', today);
            document.getElementById("end-date").setAttribute('min', today);

            const form = document.getElementById("tripForm");
            form.addEventListener("submit", function (event) {
                event.preventDefault();
                const destination = document.getElementById("destination").value;
                const startDate = document.getElementById("start-date").value;
                const endDate = document.getElementById("end-date").value;
                const invitees = document.getElementById("invitees").value;

                if (destination === "") {
                    document.getElementById("destinationFeedback").innerText = "Destination is required.";
                    return;
                } else {
                    document.getElementById("destinationFeedback").innerText = "";
                }

                alert(`Trip planned to ${destination} from ${startDate} to ${endDate}. Invitations sent to: ${invitees}`);

                window.location.href = `Itinerary.html?destination=${encodeURIComponent(destination)}&startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}&invitees=${encodeURIComponent(invitees)}`;

                const userEmail = localStorage.getItem('userEmail');
                if (userEmail) {
                    document.getElementById('login').innerText = userEmail;
                    document.getElementById('signup').style.display = 'none';
                }      
            });
        });

        document.addEventListener("DOMContentLoaded", function () {
            const userEmail = localStorage.getItem('userEmail');
            if (userEmail) {
                const loginElement = document.getElementById('login');
                loginElement.innerText = userEmail;
                loginElement.href = "#";
                loginElement.classList.add('dropdown');
                const dropdownContent = document.createElement('div');
                dropdownContent.classList.add('dropdown-content');
                const logoutLink = document.createElement('a');
                logoutLink.innerText = 'Log Out';
                logoutLink.href = "#";
                logoutLink.onclick = function () {
                    localStorage.removeItem('userEmail');
                    window.location.assign("Log in.html");
                };
                const landingPageLink = document.createElement('a');
                dropdownContent.appendChild(logoutLink);
                loginElement.appendChild(dropdownContent);
                document.getElementById('signup').style.display = 'none';
            }

            document.getElementById('destinationSelect').addEventListener('change', function () {
                const selectedDestination = this.value;
                window.location.href = `Guides.html?destination=${selectedDestination}`;
            });
        });
    </script>
</body>
</html>
