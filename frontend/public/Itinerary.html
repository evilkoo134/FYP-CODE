<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerary</title>
    <style>
        /* Enhancement: Defined CSS variables for consistency */
        :root {
            --primary-color: #007bff;
            --hover-color: #0056b3;
            --background-light: #f2f2f2;
            --border-color-light: #ccc;
            --text-color: #333;
            --error-color: #ff0000;
            --focus-color: #ffbf47;
            --animation-duration: 0.3s;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-light);
        }

        body, input, select, textarea, button {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: var(--background-light);
            border-bottom: 1px solid var(--border-color-light);
        }

        .navbar a, .navbar input, .navbar button {
            margin: 0 5px;
        }

        .navbar a, .navbar button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            text-align: center;
            transition: background-color var(--animation-duration);
        }

        .navbar a:hover, .navbar button:hover, .navbar a:focus, .navbar button:focus {
            background-color: var(--hover-color);
            outline: none;
        }

        input[type="text"], input[type="date"], button, select, textarea, input[type="number"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--border-color-light);
            border-radius: 4px;
            background-color: white;
            color: var(--text-color);
            transition: border-color var(--animation-duration);
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        button:focus,
        select:focus,
        textarea:focus,
        input[type="number"]:focus,
        input[type="file"]:focus {
            border-color: var(--focus-color);
            outline: none;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background-color var(--animation-duration);
        }

        button:hover, button:focus {
            background-color: var(--hover-color);
            outline: none;
        }

        .main-container {
            display: flex;
            padding: 20px;
        }

        .sidebar {
            flex: 1;
            padding-right: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar a {
            display: block;
            margin: 5px 0;
            padding: 10px;
            background-color: var(--background-light);
            border: 1px solid var(--border-color-light);
            border-radius: 4px;
            text-decoration: none;
            color: var(--text-color);
            transition: background-color var(--animation-duration);
        }

        .sidebar a:hover, .sidebar a:focus {
            background-color: var(--hover-color);
            color: white;
            outline: none;
        }

        .content {
            flex: 2;
            padding-right: 20px;
            overflow-y: auto;
            height: 100vh;
        }

        .map-section {
            flex: 1;
        }

        .itinerary-detail {
            margin-bottom: 20px;
        }

        .itinerary-detail img {
            max-width: 100%;
            height: auto;
        }

        .budget-section {
            margin-top: 20px;
        }

        .expense {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .popup {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 1px solid var(--border-color-light);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            z-index: 1000;
            text-align: center;
        }

        .popup.show {
            display: block;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            border: 1px dotted black;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: var(--text-color);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: auto;
            opacity: 0;
            transition: opacity var(--animation-duration);
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="Landing Page.html" id="home">Home</a>
            <a href="StudentDiscounts.html">Discover Discounts</a>
            <input type="text" placeholder="Search for a destination" aria-label="Search for a destination">
            <a href="Log in.html" id="login">Log in</a>
            <a href="Sign Up.html" id="signup">Sign Up</a>
        </nav>
    </header>

    <div class="main-container">
        <aside class="sidebar" id="sidebar">
            <h2>Itinerary</h2>
        </aside>

        <section class="content">
            <h1 id="tripTitle">Plan a Trip</h1>
            <p id="tripDates"></p>
            <p id="tripInvitees"></p>

            <div id="itinerary">
            </div>

            <div class="budget-section">
                <h2>Budget</h2>
                <div class="expense">
                    <label for="total-budget">Total Budget: $ <span class="tooltip">?
                        <span class="tooltiptext">Enter your total trip budget</span>
                    </span></label>
                    <input type="number" id="total-budget" name="total-budget" min="0" step="10">
                </div>
                <div id="daily-expenses">
                </div>
                <button id="save-itinerary">Save Itinerary</button>
            </div>
        </section>

        <aside class="map-section">
            <iframe
                id="mapFrame"
                width="100%"
                height="450"
                style="border:0"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </aside>
    </div>

    <div class="popup" id="popup">
        Itinerary saved!
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const userEmail = localStorage.getItem('userEmail');
            if (userEmail) {
                const loginElement = document.getElementById('login');
                loginElement.innerText = userEmail;
                loginElement.href = "#";
                loginElement.classList.add('dropdown');
                const dropdownContent = document.createElement('div');
                dropdownContent.classList.add('dropdown-content');
                const logoutLink = document.createElement('a');
                logoutLink.innerText = 'Log Out';
                logoutLink.href = "#";
                logoutLink.onclick = function () {
                    localStorage.removeItem('userEmail');
                    window.location.assign("Log in.html");
                };
                const landingPageLink = document.createElement('a');
                landingPageLink.innerText = 'Landing Page';
                landingPageLink.href = "Landing Page.html";
                dropdownContent.appendChild(landingPageLink);
                dropdownContent.appendChild(logoutLink);
                loginElement.appendChild(dropdownContent);
                document.getElementById('signup').style.display = 'none';
            }

            const urlParams = new URLSearchParams(window.location.search);
            const destination = urlParams.get('destination');
            const startDate = new Date(urlParams.get('startDate'));
            const endDate = new Date(urlParams.get('endDate'));
            const invitees = urlParams.get('invitees');

            document.getElementById('tripTitle').innerText = `Plan a Trip to ${destination}`;
            document.getElementById('tripDates').innerText = `From ${startDate.toDateString()} to ${endDate.toDateString()}`;

            const mapFrame = document.getElementById('mapFrame');
            mapFrame.src = `https://www.google.com/maps/embed/v1/place?key=AIzaSyD6BlM_-qNR_MEHAfjQMy7VuXEAjEOyLF4&q=${encodeURIComponent(destination)}`;

            const sidebar = document.getElementById('sidebar');
            const itinerary = document.getElementById('itinerary');
            const dailyExpenses = document.getElementById('daily-expenses');

            const getDaysArray = (start, end) => {
                for (var arr = [], dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
                    arr.push(new Date(dt));
                }
                return arr;
            };

            const daysArray = getDaysArray(startDate, endDate);
            daysArray.forEach((day, index) => {
                const dayId = `day${index + 1}`;
                const dayLink = document.createElement('a');
                dayLink.href = `#${dayId}`;
                dayLink.innerText = `${day.toDateString()}`;
                sidebar.appendChild(dayLink);

                const daySection = document.createElement('div');
                daySection.id = dayId;
                daySection.className = 'itinerary-detail';

                const dayTitle = document.createElement('h3');
                dayTitle.innerText = `Day ${index + 1} - ${day.toDateString()}`;
                daySection.appendChild(dayTitle);

                const activityInput = document.createElement('textarea');
                activityInput.placeholder = 'Enter activities for this day...';
                activityInput.addEventListener('input', autoExpand);
                daySection.appendChild(activityInput);

                const budgetInput = document.createElement('input');
                budgetInput.type = 'number';
                budgetInput.placeholder = 'Enter budget for this day...';
                budgetInput.min = '0';
                budgetInput.step = '10';
                daySection.appendChild(budgetInput);

                itinerary.appendChild(daySection);

                const expenseDiv = document.createElement('div');
                expenseDiv.className = 'expense';
                const expenseLabel = document.createElement('label');
                expenseLabel.innerText = `Day ${index + 1} Expense: $`;
                const expenseInput = document.createElement('input');
                expenseInput.type = 'number';
                expenseInput.min = '0';
                expenseInput.step = '10';
                expenseDiv.appendChild(expenseLabel);
                expenseDiv.appendChild(expenseInput);
                dailyExpenses.appendChild(expenseDiv);
            });

            document.getElementById('save-itinerary').addEventListener('click', function () {
                const itineraryDetails = Array.from(itinerary.getElementsByClassName('itinerary-detail')).map(daySection => {
                    return {
                        day: daySection.querySelector('h3').innerText,
                        activities: daySection.querySelector('textarea').value,
                        budget: daySection.querySelector('input[type="number"]').value,
                    };
                });

                fetch('http://localhost:8080/content/itineraries', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_email: userEmail,
                        destination,
                        start_date: startDate.toISOString(),
                        end_date: endDate.toISOString(),
                        itinerary_details: JSON.stringify(itineraryDetails)
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('network error');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success) {
                        const popup = document.getElementById('popup');
                        popup.style.display = 'block';
                        setTimeout(() => {
                            popup.style.display = 'none';
                        }, 3000);
                    } else {
                        alert('Failed to save itinerary.');
                    }
                })
                .catch(err => {
                    console.error('Fetch error:', err);
                    alert('Failed to save itinerary.');
                });
            });

            function autoExpand(event) {
                const element = event.target;
                element.style.height = 'auto';
                element.style.height = element.scrollHeight + 'px';
            }
        });
    </script>
</body>
</html>
