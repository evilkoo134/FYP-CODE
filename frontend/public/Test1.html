<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Itinerary</title>
    <!--<link rel="stylesheet" href="style.css">-->
<style>
/* MAIN PAGE CSS */
/* General styles, similar to what was provided earlier */
:root {
  --primary-color: #007bff;
  --hover-color: #0056b3;
  --background-light: #f2f2f2;
  --border-color-light: #ccc;
  --text-color: #333;
  --error-color: #ff0000; /* For error messages */
}

body, input, button {
  font-family: Arial, sans-serif;
  box-sizing: border-box;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #f2f2f2;
  padding: 10px;
  border-bottom: 1px solid #ccc;
}

.main-container {
  display: flex;
  justify-content: space-between;
  margin: 20px;
}

.sidebar, .content, .map-section {
  padding: 10px;
}

.sidebar {
  width: 20%;
  border-right: 1px solid #ccc;
}

.content {
  width: 50%;
}

.map-section {
  width: 50%;
  height: 450px;
}

.itinerary-detail {
  display: flex;
  align-items: center;
  margin-bottom: 20px;
}

.itinerary-detail img {
  width: 100px;
  height: 100px;
  margin-right: 10px;
  border-radius: 4px;
}

/* sidebar */
html {
  scroll-behavior: smooth; /* Enables smooth scrolling */
}

.navbar, .sidebar, .content, .map-section {
  padding: 10px;
}

.sidebar a {
  display: block;
  margin-bottom: 20px;
  color: #007bff; /* Blue link color */
  text-decoration: none;
}

.sidebar a:hover {
  text-decoration: underline;
}

.itinerary-detail {
  border: 1px solid #ccc;
  margin-bottom: 10
}

/* Main Content Section Styling */
.content {
  width: 50%; /* or your specified width */
  padding: 10px;
  height: 1200px; /* Example fixed height */
  overflow-y: auto; /* Enables vertical scrolling */
  border-right: 1px solid #ccc; /* Visual consistency */
}

/* Scrollbar Styling for Webkit Browsers */
.content::-webkit-scrollbar {
  width: 8px; /* Scrollbar width */
}

.content::-webkit-scrollbar-track {
  background: #f1f1f1; /* Track color */
}

.content::-webkit-scrollbar-thumb {
  background: #888; /* Thumb color */
}

.content::-webkit-scrollbar-thumb:hover {
  background: #555; /* Thumb hover color */
}
</style>
</head>
<body>
    <header class="navbar">
        <div class="logo">[Logo Here]</div>
        <nav>
            <a href="#" class="nav-link active">Home</a>
            <a href="#" class="nav-link">Guides</a>
            <input type="text" placeholder="Enter a Place" aria-label="Search">
            <button class="login-button">Log in</button>
            <button class="signup-button">Sign Up</button>
        </nav>
    </header>
    
    <div class="container">
        <aside class="sidebar">
            <ul class="menu">
                <li class="menu-item">Itinerary</li>
                <li class="menu-item">Budget</li>
                <!-- More menu items -->
            </ul>
        </aside>
        
        <main class="content">
            <section class="itinerary-section">
                <h1>Itinerary to London</h1>
                <!-- Itinerary details go here -->
            </section>
            <section class="budget-section">
                <h2>Budgeting</h2>
                <!-- Budget details go here -->
            </section>
            <section class="places-to-visit-section">
                <h2>Places to Visit</h2>
                <!-- Places to visit details go here -->
            </section>
        </main>

        <aside class="map-section">
            <div class="map-container">
                <!-- Replace the src with the link you copied from Google Maps -->
                <iframe
                    src="https://maps.app.goo.gl/EAEYaiud9ggZjQow6"
                    width="600"
                    height="450"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy">
                </iframe>
            </div>
            <button aria-label="Zoom in">+</button>
            <button aria-label="Zoom out">-</button>
        </aside>
    </div>

    <footer class="footer">
        <!-- Footer content -->
    </footer>
    
    <script src="scripts.js"></script>
</body>
</html>
