<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guides</title>
    <style>
        :root {
            --primary-color: #007bff;
            --hover-color: #0056b3;
            --background-light: #f2f2f2;
            --border-color-light: #ccc;
            --text-color: #333;
            --error-color: #ff0000;
            --focus-color: #ffbf47;
            --animation-duration: 0.3s;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-light);
        }

        body, input, select, textarea, button {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: var(--background-light);
            border-bottom: 1px solid var(--border-color-light);
        }

        .navbar a, .navbar input, .navbar button {
            margin: 0 5px;
        }

        .navbar a, .navbar button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            text-align: center;
            transition: background-color var(--animation-duration);
        }

        .navbar a:hover, .navbar button:hover, .navbar a:focus, .navbar button:focus {
            background-color: var(--hover-color);
            outline: none;
        }

        input[type="text"], input[type="date"], button, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--border-color-light);
            border-radius: 4px;
            background-color: white;
            color: var(--text-color);
            transition: border-color var(--animation-duration);
        }

        .main-container {
            padding: 20px;
        }

        .guide {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        @media screen and (min-width: 768px) {
            .navbar input {
                flex: 1;
            }

            .navbar a, .navbar button {
                flex: 0 0 auto;
            }
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>Look For a Guide!</h1>
        <nav class="navbar">
            <a href="Landing Page.html" id="home">Home</a>
            <a href="StudentDiscounts.html">Discover Discounts</a>
            <select id="destinationSelect" aria-label="Select a destination">
                <option value="" disabled selected>Select a destination</option>
                <option value="paris">Paris</option>
                <option value="newyork">New York</option>
                <option value="tokyo">Tokyo</option>
                <option value="sydney">Sydney</option>
                <option value="london">London</option>
            </select>
            <a href="Log in.html" id="login">Log in</a>
            <a href="Sign Up.html" id="signup">Sign Up</a>
        </nav>
    </header>
    <main class="main-container">
        <h1>Destination Guides</h1>
        <div id="guideContent">
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const userEmail = localStorage.getItem('userEmail');
            const userId = localStorage.getItem('userId');

            if (userEmail) {
                const loginElement = document.getElementById('login');
                loginElement.innerText = userEmail;
                loginElement.href = "#";
                loginElement.classList.add('dropdown');
                const dropdownContent = document.createElement('div');
                dropdownContent.classList.add('dropdown-content');
                const logoutLink = document.createElement('a');
                logoutLink.innerText = 'Log Out';
                logoutLink.href = "#";
                logoutLink.onclick = function () {
                    localStorage.removeItem('userEmail');
                    localStorage.removeItem('userId');
                    window.location.assign("Log in.html");
                };
                const landingPageLink = document.createElement('a');
                dropdownContent.appendChild(logoutLink);
                loginElement.appendChild(dropdownContent);
                document.getElementById('signup').style.display = 'none';
            const urlParams = new URLSearchParams(window.location.search);
            const destination = urlParams.get('destination');
            const guideContent = document.getElementById('guideContent');

            const guides = {
                paris: '<div class="guide"><h2>Paris</h2><p>Welcome to Paris! Here are some guides to help you explore the city.</p></div>',
                newyork: '<div class="guide"><h2>New York</h2><p>Welcome to New York! Here are some guides to help you explore the city.</p></div>',
                tokyo: '<div class="guide"><h2>Tokyo</h2><p>Welcome to Tokyo! Here are some guides to help you explore the city.</p></div>',
                sydney: '<div class="guide"><h2>Sydney</h2><p>Welcome to Sydney! Here are some guides to help you explore the city.</p></div>',
                london: '<div class="guide"><h2>London</h2><p>Welcome to London! Here are some guides to help you explore the city.</p></div>'
            };

            if (guides[destination]) {
                guideContent.innerHTML = guides[destination];
            } else {
                guideContent.innerHTML = '<p>No guides available for this destination.</p>';
            }
            }
        });

        document.getElementById('destinationSelect').addEventListener('change', function () {
            const selectedDestination = this.value;
            window.location.href = `Guides.html?destination=${selectedDestination}`;
        });
    </script>
</body>
</html>
