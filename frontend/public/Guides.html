<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guides Section</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
        }
        nav ul {
            list-style: none;
            display: flex;
        }
        nav li {
            margin-right: 1rem;
        }
        main {
            padding: 2rem;
        }
        .guide {
            border: 1px solid #ddd;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .guide img {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Guides</a></li>
                <li><input type="text" placeholder="Enter a destination"></li>
                <li><a href="#">Log in</a></li>
                <li><a href="#">Sign Up</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Guides</h1>
        <input type="text" placeholder="Enter a Destination">
        <div class="guide">
            <img src="guide-image.jpg" alt="Guide Image">
            <p>Description of Guide</p>
            <p>Author</p>
            <button>(save)</button>
            <button>(likes)</button>
        </div>
        <!-- Repeat the guide placeholders as needed -->
        <button>More</button>
        <button>Add Guide</button>
    </main>
</body>
</html>
